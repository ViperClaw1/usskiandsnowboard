<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Preconnect to Google Fonts servers as early as possible so the
         font request is in-flight before the CSS @import fires.
         The crossorigin attribute is required for the fonts.gstatic.com
         preconnect because font files are fetched as cross-origin requests. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the Montserrat stylesheet so the browser fetches it
         immediately rather than waiting to discover it inside the CSS.
         This eliminates the FOUT (Flash of Unstyled Text) that caused
         the font swap to happen after the first paint — which was changing
         text metrics across all dashboard cards, shifting total page height
         past the viewport threshold and triggering the scrollbar flash. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />

    <!-- Primary Meta Tags -->
    <title>Athlete Career Dashboard | U.S. Ski &amp; Snowboard</title>
    <meta name="title" content="Athlete Career Dashboard | U.S. Ski & Snowboard" />
    <meta
      name="description"
      content="Connect U.S. Ski &amp; Snowboard athletes with meaningful career opportunities, internships, and mentorship beyond competition. Launch your next chapter."
    />
    <meta name="author" content="U.S. Ski & Snowboard" />
    <meta
      name="keywords"
      content="U.S. Ski, Snowboard, Athletes, Career, Opportunities, Jobs, Internships, Mentorship, Elite Athletes"
    />
    <link rel="canonical" href="https://athleteconnection.org/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://athleteconnection.org/" />
    <meta
      property="og:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/0VST18xPWDMkBG3SfWmRreygUxG2/social-images/social-1760936732383-usski&amp;snowboard800.jpg"
    />
    <meta property="og:site_name" content="U.S. Ski & Snowboard Athlete Connection" />
    <meta property="og:title" content="Athlete Career Dashboard | U.S. Ski &amp; Snowboard" />
    <meta
      property="og:description"
      content="Connect U.S. Ski &amp; Snowboard athletes with meaningful career opportunities, internships, and mentorship beyond competition. Launch your next chapter."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://athleteconnection.org/" />
    <meta
      name="twitter:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/0VST18xPWDMkBG3SfWmRreygUxG2/social-images/social-1760936732383-usski&amp;snowboard800.jpg"
    />
    <meta name="twitter:site" content="@usskiteam" />
    <meta name="twitter:title" content="Athlete Career Dashboard | U.S. Ski &amp; Snowboard" />
    <meta
      name="twitter:description"
      content="Connect U.S. Ski &amp; Snowboard athletes with meaningful career opportunities, internships, and mentorship beyond competition. Launch your next chapter."
    />

    <!-- Favicon & Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e3a5f" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
